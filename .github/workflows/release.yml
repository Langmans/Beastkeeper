# Pushing a tag (e.g. v1.0.0) runs the CI checks, then builds the zip with BigWigsMods/packager
# (Ace3 from the .pkgmeta externals, translations from CurseForge), uploads it to CurseForge and
# attaches it to a GitHub release. The CurseForge upload and the translations are skipped while
# the CF_API_KEY secret or the project ID in Kennel.toc is missing.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The packager builds the changelog from the commits since the previous tag.
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
